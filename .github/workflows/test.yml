name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Provides a stable secret so encrypt/decrypt tests don't
          # need filesystem access to ~/.mosaic/secret.key
          AUTH_SECRET: ci-test-secret-key-32-chars-padding
