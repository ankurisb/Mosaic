# ── Mosaic — Full Stack Docker Compose ───────────────────────
# Starts: Mosaic + Airbyte + Apache Superset
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
#   docker compose logs -f mosaic # tail Mosaic logs
#
# First run pulls ~4-5GB of images. Requires Docker Desktop
# with at least 6GB RAM allocated (Docker → Settings → Resources).
#
# All services use a shared internal network. Only Mosaic (3001),
# Airbyte (8000), and Superset (8088) are exposed to the host.

services:

  # ── Tunnel (Remote Support) ───────────────────────────────────
  # Managed cloudflared tunnel for support sessions.
  # Internal only — no ports exposed to host.
  # Mosaic talks to it via http://mosaic-tunnel:3100.
  # Tunnel only runs when admin starts a session from Settings → Remote Support.
  mosaic-tunnel:
    build:
      context: ./services/tunnel
      dockerfile: Dockerfile
    container_name: mosaic-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TARGET=http://mosaic:3001
    # No ports exposed — internal only. Mosaic reaches it via
    # http://mosaic-tunnel:3100 on the Docker network.
    # For local dev add: ports: ["3100:3100"] and set
    # TUNNEL_MANAGER_URL=http://localhost:3100 in .env.local
    networks:
      - mosaic-net

  # ── Watchdog ─────────────────────────────────────────────────
  # Always-on diagnostic sidecar. Works even when Mosaic is down.
  # Open http://localhost:3099 if Mosaic isn't loading.
  # No depends_on — starts independently of everything else.
  mosaic-watchdog:
    build:
      context: ./services/watchdog
      dockerfile: Dockerfile
    container_name: mosaic-watchdog
    restart: unless-stopped
    ports:
      - "3099:3099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./NETWORK.md:/mosaic/NETWORK.md:ro
    networks:
      - mosaic-net

  # ── Backup sidecar ──────────────────────────────────────────
  # Runs automated backups on a schedule (default: every 24h).
  # Backups land in ./backups/ on the host.
  # Status visible in Settings → System Health → Backup.
  # Override schedule: BACKUP_SCHEDULE_HOURS=12 in .env
  # Override retention: BACKUP_KEEP=14 in .env
  mosaic-backup:
    build:
      context: ./services/backup
      dockerfile: Dockerfile
    container_name: mosaic-backup
    restart: unless-stopped
    environment:
      - BACKUP_DIR=/backups
      - BACKUP_SCHEDULE_HOURS=${BACKUP_SCHEDULE_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
    volumes:
      - mosaic-data:/volumes/mosaic-data:ro
      - superset-db-data:/volumes/superset-db-data:ro
      - n8n-data:/volumes/n8n-data:ro
      - ciso-data:/volumes/ciso-data:ro
      - ./backups:/backups
      - backup-status:/backup-status
    networks:
      - mosaic-net

  # ── Mosaic ──────────────────────────────────────────────────
  mosaic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosaic
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Copy from .env or set directly here
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mosaic.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      # SQLite path inside container
      - DATABASE_URL=sqlite:///data/mosaic.db
      # Superset (internal Docker network URL)
      - SUPERSET_URL=http://superset:8088
      - SUPERSET_ADMIN_USER=admin
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-Admin1234!}
      # Airbyte (internal Docker network URL)
      - AIRBYTE_URL=http://airbyte-proxy:8000
      # Elasticsearch (internal Docker network URL — Mosaic Search Index)
      - ELASTICSEARCH_INTERNAL_URL=http://elasticsearch:9200
      # Stats sidecar (internal Docker network URL)
      - STATS_SIDECAR_URL=http://mosaic-stats:8001
      # Tunnel manager (internal Docker network URL — remote support sessions)
      - TUNNEL_MANAGER_URL=http://mosaic-tunnel:3100
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
      - AIRBYTE_USER=airbyte
      - AIRBYTE_PASSWORD=${AIRBYTE_PASSWORD:-password}
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # n8n integration
      - N8N_URL=${N8N_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      # n8n shared owner account for the login handshake (lib/n8n.ts)
      - N8N_OWNER_EMAIL=${N8N_OWNER_EMAIL:-n8n-owner@mosaic.local}
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD:-Mosaic-n8n-Owner1}
      # OpenMeter metering (internal Docker network URL)
      - OPENMETER_URL=http://openmeter:8888
      # SSO / Keycloak (optional — set SSO_ENABLED=true to use)
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
    volumes:
      - mosaic-data:/data
      - backup-status:/backup-status:ro
    depends_on:
      superset:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      openmeter:
        condition: service_healthy
      ciso-caddy:
        condition: service_started
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Airbyte ─────────────────────────────────────────────────
  # Uses Airbyte's official Docker Compose services
  # Auth: basic (airbyte / password) — Mosaic detects this automatically

  airbyte-db:
    image: airbyte/db:dev
    container_name: airbyte-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - DATABASE_USER=docker
      - DATABASE_PASSWORD=docker
      - DATABASE_DB=airbyte
    volumes:
      - airbyte-db-data:/var/lib/postgresql/data
    networks:
      - mosaic-net

  airbyte-server:
    image: airbyte/server:latest
    container_name: airbyte-server
    restart: unless-stopped
    environment:
      - AIRBYTE_VERSION=latest
      - DATABASE_USER=docker
      - DATABASE_PASSWORD=docker
      - DATABASE_HOST=airbyte-db
      - DATABASE_PORT=5432
      - DATABASE_DB=airbyte
      - WORKSPACE_ROOT=/tmp/workspace
      - WORKER_ENVIRONMENT=docker
      - SECRET_PERSISTENCE=NONE
      - INTERNAL_API_HOST=airbyte-server:8001
      - BASIC_AUTH_USERNAME=${AIRBYTE_USER:-airbyte}
      - BASIC_AUTH_PASSWORD=${AIRBYTE_PASSWORD:-password}
    volumes:
      - airbyte-workspace:/tmp/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airbyte-db
    networks:
      - mosaic-net

  airbyte-proxy:
    image: airbyte/proxy:latest
    container_name: airbyte-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - BASIC_AUTH_USERNAME=${AIRBYTE_USER:-airbyte}
      - BASIC_AUTH_PASSWORD=${AIRBYTE_PASSWORD:-password}
      - PROXY_PASS_WEB=airbyte-webapp:80
      - PROXY_PASS_API=airbyte-server:8001
      - PROXY_PASS_CONNECTOR_BUILDER_SERVER=airbyte-connector-builder-server:80
      - CONNECTOR_BUILDER_SERVER_API_HOST=airbyte-connector-builder-server
    depends_on:
      - airbyte-server
    networks:
      - mosaic-net

  # ── Superset ────────────────────────────────────────────────
  superset-db:
    image: postgres:15-alpine
    container_name: superset-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=superset
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${SUPERSET_DB_PASSWORD:-superset}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-redis:
    image: redis:7-alpine
    container_name: superset-redis
    restart: unless-stopped
    networks:
      - mosaic-net

  superset:
    build:
      context: docker/superset
      dockerfile: Dockerfile
    image: mosaic-superset:3.1.3
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      # WARNING: Never change this after first boot — Superset encrypts its
      # metadata DB with this key. Changing it makes existing data unreadable.
      # Set once in .env.local using: openssl rand -hex 32
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY must be set in .env.local}
      - DATABASE_URL=postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD:-superset}@superset-db/superset
      - REDIS_URL=redis://superset-redis:6379/0
      - SUPERSET_WEBSERVER_PORT=8088
      # Served under /superset behind the Mosaic front door (Caddy). Set to '/'
      # to run Superset standalone at root.
      - SUPERSET_APP_ROOT=${SUPERSET_APP_ROOT:-/superset}
      # First-run admin (matches Mosaic admin)
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mosaic.local}
      - ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-Admin1234!}
      - ADMIN_FIRSTNAME=Mosaic
      - ADMIN_LASTNAME=Admin
      # Embedding
      - FEATURE_FLAGS={"EMBEDDED_SUPERSET":true,"DASHBOARD_RBAC":true}
    volumes:
      - superset-data:/app/superset_home
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_started
    networks:
      - mosaic-net
    command: bash /app/pythonpath/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Keycloak (optional SSO — enable with SSO_ENABLED=true) ─────────
  # Self-hosted OIDC identity provider. Connects to AD/LDAP for enterprise SSO.
  # Admin UI: http://localhost:8080 (admin / ${KEYCLOAK_ADMIN_PASSWORD:-admin})
  #
  # HOW TO ENABLE:
  #   Add to your .env file:
  #     SSO_ENABLED=true
  #     COMPOSE_PROFILES=sso
  #   Then run: docker compose up -d
  #
  # OR start manually alongside a running stack:
  #   docker compose --profile sso up -d keycloak
  #
  # After first start: see KEYCLOAK.md for realm + client setup (5 min).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: mosaic-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=dev-file
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - mosaic-net
    profiles:
      - sso
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── n8n ─────────────────────────────────────────────────────
  # Self-hosted workflow automation. Invisible to end users.
  # Admin UI accessible at http://localhost:5678 (admin only)
  n8n:
    image: n8nio/n8n:latest
    container_name: mosaic-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      # Served under /n8n behind the Mosaic front door (Caddy). N8N_PATH sets
      # the subpath; editor/webhook base URLs are the external HTTPS origin.
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://${MOSAIC_HOSTNAME:-localhost}/n8n/
      - WEBHOOK_URL=https://${MOSAIC_HOSTNAME:-localhost}/n8n/
      # Trust one proxy hop (Caddy) so n8n honours X-Forwarded-Proto=https
      # and keeps its Secure auth cookie valid behind TLS termination.
      - N8N_PROXY_HOPS=1
      # n8n internal metadata stored in its own DB
      - DB_TYPE=sqlite
      # User-management (email/password) is n8n's auth on 2.x. The Mosaic
      # login handshake logs in server-side; the old N8N_BASIC_AUTH_* vars
      # are no-ops on 2.x and have been removed.
      - N8N_USER_MANAGEMENT_DISABLED=false
      # Mosaic API base URL for n8n workflows to call back
      - MOSAIC_URL=http://mosaic:3001
      - MOSAIC_API_KEY=${N8N_MOSAIC_API_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - mosaic
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Elasticsearch (Mosaic Search Index) ────────────────────
  # Internal only — never exposed to host. Fed by Airbyte syncs.
  # Gives Claude full-text search across technician notes,
  # fault descriptions, and shift narratives from all sources.
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: mosaic-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=mosaic-cluster
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── OpenMeter (Usage Metering) ──────────────────────────────
  # Self-hosted metering infrastructure — collects structured usage
  # events from Mosaic (chat completions, tool calls, RCA runs, etc.)
  # and stores them in ClickHouse for high-cardinality time-series queries.
  #
  # ISOLATION: openmeter-clickhouse runs on internal port 19000 only.
  # It is completely separate from any ClickHouse a customer may run
  # for their own IoT/telemetry data. Never exposed to the host.
  #
  # Mosaic emits events via: POST http://openmeter:8888/v1/events
  # OpenMeter UI (when needed): http://localhost:10000
  # Lago wires in later for invoice generation — not included yet.
  # ── Redpanda (Kafka-compatible message broker for OpenMeter) ─
  # OpenMeter requires Kafka for event ingestion. Redpanda is a
  # single-binary Kafka-compatible broker — no ZooKeeper, no JVM.
  # Internal only — never exposed to host.
  openmeter-postgres:
    image: postgres:15-alpine
    container_name: mosaic-openmeter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=openmeter
      - POSTGRES_USER=openmeter
      - POSTGRES_PASSWORD=${OPENMETER_POSTGRES_PASSWORD:-openmeter-pg-secret}
    volumes:
      - openmeter-postgres-data:/var/lib/postgresql/data
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmeter"]
      interval: 10s
      timeout: 5s
      retries: 5

  openmeter-redpanda:
    image: redpandadata/redpanda:latest
    container_name: mosaic-openmeter-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://openmeter-redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    volumes:
      - openmeter-redpanda-data:/var/lib/redpanda/data
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  openmeter-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: mosaic-openmeter-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=openmeter
      - CLICKHOUSE_USER=openmeter
      - CLICKHOUSE_PASSWORD=${OPENMETER_CLICKHOUSE_PASSWORD:-openmeter-ch-secret}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      # Force IPv4 listen — Docker Desktop on macOS disables IPv6
      - CLICKHOUSE_LISTEN_HOST=0.0.0.0
    volumes:
      - openmeter-clickhouse-data:/var/lib/clickhouse
    # Port 19000 intentionally NOT exposed to host — internal only.
    # openmeter container talks to it over mosaic-net.
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  openmeter:
    image: ghcr.io/openmeterio/openmeter:latest
    container_name: mosaic-openmeter
    restart: unless-stopped
    command: ["/bin/sh", "/etc/openmeter/start.sh"]
    ports:
      - "10000:10000"   # Admin UI — accessible locally for inspection
      - "8888:8888"     # Ingest API — exposed for local dev (npm run dev)
    volumes:
      - ./docker/openmeter/config.yaml:/etc/openmeter/config.yaml:ro
      - ./docker/openmeter/start.sh:/etc/openmeter/start.sh:ro
    depends_on:
      openmeter-clickhouse:
        condition: service_healthy
      openmeter-redpanda:
        condition: service_healthy
      openmeter-postgres:
        condition: service_healthy
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Consumes events from Kafka (om_sys.api_events) and writes to ClickHouse.
  # Required for events to flow from ingest → storage. Runs alongside openmeter.
  openmeter-sink-worker:
    image: ghcr.io/openmeterio/openmeter:latest
    container_name: mosaic-openmeter-sink-worker
    restart: unless-stopped
    command: ["/usr/local/bin/openmeter-sink-worker", "--config", "/etc/openmeter/config.yaml"]
    volumes:
      - ./docker/openmeter/config.yaml:/etc/openmeter/config.yaml:ro
    depends_on:
      openmeter:
        condition: service_healthy
    networks:
      - mosaic-net

  # ── Stats Sidecar ───────────────────────────────────────────
  # Python FastAPI service for statistical analysis.
  # Internal only — never exposed to host.
  # Claude calls it via run_statistical_analysis tool.
  mosaic-stats:
    build:
      context: ./services/stats-sidecar
      dockerfile: Dockerfile
    container_name: mosaic-stats
    restart: unless-stopped
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── CISO Assistant (GRC Platform) ───────────────────────────
  # Self-hosted GRC platform: ISO 27001, SOC 2, NIST CSF, and
  # 130+ frameworks. Handles risk register, control evidence,
  # audit documentation, and Statement of Applicability.
  #
  # Complements Mosaic's automated technical controls layer:
  #   Mosaic     → Settings → Audit trail → "Show live checks"
  #                automated evidence (logging, encryption, RBAC)
  #   CISO Asst. → http://localhost:8443
  #                governance docs (risk register, SOPs, SoA)
  #
  # First run creates the superuser from CISO_SUPERUSER_EMAIL /
  # CISO_SUPERUSER_PASSWORD in .env.local automatically.
  # Access: http://localhost:8443

  ciso-backend:
    build:
      context: ./docker/ciso
      dockerfile: Dockerfile.backend
    container_name: ciso-backend
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=ciso-backend,localhost,127.0.0.1
      - CISO_ASSISTANT_URL=http://localhost:8443
      - DJANGO_DEBUG=True
      - AUTH_TOKEN_TTL=7200
      # Django createsuperuser --noinput uses DJANGO_SUPERUSER_* vars
      - DJANGO_SUPERUSER_EMAIL=${CISO_SUPERUSER_EMAIL:-admin@mosaic.local}
      - DJANGO_SUPERUSER_PASSWORD=${CISO_SUPERUSER_PASSWORD:-changeme}
      - CSRF_TRUSTED_ORIGINS=http://localhost:8443
      # Custom settings — overrides cookie security flags for plain HTTP on-prem
    volumes:
      - ciso-data:/code/db
    networks:
      - mosaic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/schema/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  ciso-frontend:
    image: ghcr.io/intuitem/ciso-assistant-community/frontend:latest
    container_name: ciso-frontend
    pull_policy: always
    restart: unless-stopped
    environment:
      - PUBLIC_BACKEND_API_URL=http://ciso-backend:8000/api
      - PUBLIC_BACKEND_API_EXPOSED_URL=http://localhost:8443/api
      - ORIGIN=http://localhost:8443
    depends_on:
      ciso-backend:
        condition: service_healthy
    networks:
      - mosaic-net

  ciso-caddy:
    image: caddy:2.11.2
    container_name: ciso-caddy
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./docker/ciso/Caddyfile:/etc/caddy/Caddyfile:ro
      - ciso-caddy-data:/data/caddy
    depends_on:
      - ciso-frontend
      - ciso-backend
    networks:
      - mosaic-net

  # ── Mosaic front door (app-wide reverse proxy) ──────────────
  # Single origin + single login for Mosaic and its embedded interfaces.
  # Gates /n8n via forward_auth to Mosaic's authz endpoint. HTTPS is
  # required (n8n's cookie is Secure). Set MOSAIC_HOSTNAME to a real FQDN
  # for automatic public TLS; otherwise Caddy issues an internal cert.
  # Access the whole stack via https://<MOSAIC_HOSTNAME> (default localhost).
  mosaic-caddy:
    image: caddy:2.11.2
    container_name: mosaic-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      - MOSAIC_HOSTNAME=${MOSAIC_HOSTNAME:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mosaic
      - n8n
    networks:
      - mosaic-net

# ── Volumes ─────────────────────────────────────────────────
volumes:
  caddy-data:
  caddy-config:
  mosaic-data:
  airbyte-db-data:
  airbyte-workspace:
  superset-db-data:
  superset-data:
  n8n-data:
  es-data:
  keycloak-data:
  openmeter-clickhouse-data:
  openmeter-redpanda-data:
  openmeter-postgres-data:
  ciso-data:
  ciso-caddy-data:
  backup-status:

# ── Network ──────────────────────────────────────────────────
networks:
  mosaic-net:
    driver: bridge
