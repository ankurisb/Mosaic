# Mosaic Demo / Test-Data Harness — compose OVERLAY
# =================================================
# Optional estate of sample industrial data sources that Mosaic can connect to:
# Postgres (plant ops), MySQL (ERP), SQL Server (CMMS), InfluxDB v1 (telemetry),
# MongoDB (event logs), Elasticsearch (logs/alarms), plus SFTP and S3 (MinIO)
# file drops. All seeded on first start from ./test-data.
#
# This is an OVERLAY — it is merged with the main compose so the harness joins
# Mosaic's own `mosaic-net` network and is reachable by service name:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile demo up -d
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile demo down
#   # wipe harness data too:  ... down -v
#
# All services sit behind `profiles: ["demo"]`, so a normal `up` never starts
# them even when this file is included. They publish NO host ports — Mosaic
# reaches them in-network by the service names used in Settings → Data sources
# → "Add test harness" (postgres, mysql, mssql, influxdb, mongodb,
# elasticsearch, sftp, minio). Resource footprint is ~3 GB RAM when all up.
#
# Images are MIRRORED to GHCR (ghcr.io/ankurisb/mosaic-demo:<tag>) rather than
# pulled from Docker Hub / mcr / quay. This uses the one registry every Mosaic
# box already authenticates to, avoids Docker Hub rate limits and MinIO's
# withdrawn Hub `latest` tag, and works air-gapped. The mirror is produced by
# .github/workflows/mirror-demo-images.yml; pin each tag to its @sha256 digest
# from that run's summary for reproducible, tamper-evident pulls.
#
# Convenience wrapper: ./mosaic-harness.sh {on|off|status} (scripts/ in the repo).

services:
  # ─── PostgreSQL: "Plant Operations" ────────────────────────────────
  postgres:
    image: ghcr.io/ankurisb/mosaic-demo:postgres-16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: mosaic-demo-postgres
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic_pw
      POSTGRES_DB: plant_ops
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./test-data/seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d plant_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MySQL: "ERP Lite" ─────────────────────────────────────────────
  mysql:
    image: ghcr.io/ankurisb/mosaic-demo:mysql-8.3@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe
    container_name: mosaic-demo-mysql
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: erp_lite
      MYSQL_USER: mosaic
      MYSQL_PASSWORD: mosaic_pw
    volumes:
      - demo-mysql-data:/var/lib/mysql
      - ./test-data/seed/mysql:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umosaic", "-pmosaic_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── SQL Server: "Maintenance CMMS" ────────────────────────────────
  mssql:
    image: ghcr.io/ankurisb/mosaic-demo:mssql-2022@sha256:a98246d587cb46082fd638ece88f99a3744113b16787e2c724b8f4e38885dcc8
    container_name: mosaic-demo-mssql
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mosaic_Strong_Pw_1"   # must meet complexity rules
      MSSQL_PID: Developer
    volumes:
      - demo-mssql-data:/var/opt/mssql
      - ./test-data/seed/mssql:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Mosaic_Strong_Pw_1 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Runs once after mssql is healthy, loads the seed SQL, then exits.
  mssql-seed:
    image: ghcr.io/ankurisb/mosaic-demo:mssql-tools@sha256:8e5bad6abd253376af95e94489326d8b67f16d565b89461405a3238784e86200
    container_name: mosaic-demo-mssql-seed
    profiles: ["demo"]
    networks: [mosaic-net]
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./test-data/seed/mssql:/seed:ro
    entrypoint: >
      bash -c "
        echo 'Seeding SQL Server...';
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P Mosaic_Strong_Pw_1 -i /seed/01_schema.sql -i /seed/02_data.sql;
        echo 'SQL Server seed complete.';
      "
    restart: on-failure

  # ─── InfluxDB v1: "Sensor Telemetry" ───────────────────────────────
  influxdb:
    image: ghcr.io/ankurisb/mosaic-demo:influxdb-1.8@sha256:299ebda2c7e308dbef42e26ac9b8fd1d9b3bcb8a0aee80c6509aa0219c1d0290
    container_name: mosaic-demo-influxdb
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      INFLUXDB_DB: telemetry
      INFLUXDB_ADMIN_USER: mosaic
      INFLUXDB_ADMIN_PASSWORD: mosaic_pw
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - demo-influxdb-data:/var/lib/influxdb
      - ./test-data/seed/influxdb:/seed:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  influxdb-seed:
    image: ghcr.io/ankurisb/mosaic-demo:alpine-3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
    container_name: mosaic-demo-influxdb-seed
    profiles: ["demo"]
    networks: [mosaic-net]
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./test-data/seed/influxdb:/seed:ro
    entrypoint: >
      sh -c "
        apk add --no-cache curl coreutils >/dev/null;
        echo 'Seeding InfluxDB (chunked)...';
        split -l 5000 /seed/telemetry.lp /tmp/lp_chunk_;
        n=0;
        for f in /tmp/lp_chunk_*; do
          curl -sf -u mosaic:mosaic_pw -XPOST 'http://influxdb:8086/write?db=telemetry&precision=ns' --data-binary @$$f || { echo \"Failed on $$f\"; exit 1; };
          n=$$((n+1));
        done;
        echo \"InfluxDB seed complete ($$n chunks).\";
      "
    restart: on-failure

  # ─── MongoDB: "Event Logs" ─────────────────────────────────────────
  mongodb:
    image: ghcr.io/ankurisb/mosaic-demo:mongo-7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: mosaic-demo-mongodb
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mosaic
      MONGO_INITDB_ROOT_PASSWORD: mosaic_pw
      MONGO_INITDB_DATABASE: event_logs
    volumes:
      - demo-mongodb-data:/data/db
      - ./test-data/seed/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO: S3-compatible file server ──────────────────────────────
  # PENDING an S3 image: MinIO restricted its image distribution in 2025 (its
  # Docker Hub repos were removed and quay.io now requires authentication), so
  # minio/minio and minio/mc are NOT mirrored to GHCR and the two tags below do
  # not yet resolve. The default bring-up (scripts/mosaic-harness.sh) excludes
  # these two services, so the other 7 sources start cleanly. To enable the S3
  # source, mirror a freely-distributable S3 image (e.g. Bitnami MinIO, or an
  # alternative such as SeaweedFS / adobe/s3mock) to ghcr.io/ankurisb/mosaic-demo
  # :minio (+ :mc for the seeder) and re-add them to the up list.
  minio:
    image: ghcr.io/ankurisb/mosaic-demo:minio
    container_name: mosaic-demo-minio
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      MINIO_ROOT_USER: mosaic
      MINIO_ROOT_PASSWORD: mosaic_pw_12   # must be >= 8 chars
    command: server /data --console-address ":9001"
    volumes:
      - demo-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Creates the bucket and uploads the sample files on first run.
  minio-seed:
    image: ghcr.io/ankurisb/mosaic-demo:mc
    container_name: mosaic-demo-minio-seed
    profiles: ["demo"]
    networks: [mosaic-net]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./test-data/files:/files:ro
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 mosaic mosaic_pw_12;
        mc mb -p local/mosaic-test || true;
        mc cp --recursive /files/ local/mosaic-test/;
        echo 'MinIO seed complete. Bucket: mosaic-test';
        mc ls local/mosaic-test;
      "
    restart: on-failure

  # ─── SFTP: file server over SSH ────────────────────────────────────
  sftp:
    image: ghcr.io/ankurisb/mosaic-demo:sftp-alpine@sha256:52b1dcace64c3d550a5324d4e7ae579d5fa38fed5a54cfd19e373cc9744eca57
    container_name: mosaic-demo-sftp
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    volumes:
      - demo-sftp-data:/home/mosaic/upload
      - ./test-data/files:/home/mosaic/upload/initial:ro  # initial sample files
    command: mosaic:mosaic_pw:1001

  # ─── Mock SAP OData API ────────────────────────────────────────────
  mock-sap-api:
    image: ghcr.io/ankurisb/mosaic-demo:node-20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    container_name: mosaic-demo-mock-sap
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    working_dir: /app
    volumes:
      - ./test-data/mock-api:/app
    command: sh -c "npm install --silent --no-audit --no-fund && node server.js"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Authorization: Bearer testtoken", "http://127.0.0.1:4001/sap/opu/odata/sap/API_EQUIPMENT_SRV/Equipment?$$top=1&$$format=json"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Elasticsearch: "Maintenance Logs, Alarms, Quality, Operator Logbook" ───
  elasticsearch:
    image: ghcr.io/ankurisb/mosaic-demo:elasticsearch-8.13.0@sha256:9d1cd1491778aceca4490de7ec9f205c3633a277df15473e1ea507d13a5270c6
    container_name: mosaic-demo-elasticsearch
    profiles: ["demo"]
    restart: unless-stopped
    networks: [mosaic-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - demo-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Seeds four indices: maintenance_logs, alarm_events, quality_events, operator_logbook
  elasticsearch-seed:
    image: ghcr.io/ankurisb/mosaic-demo:curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: mosaic-demo-elasticsearch-seed
    profiles: ["demo"]
    networks: [mosaic-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./test-data/seed/elasticsearch:/seed:ro
    entrypoint: >
      sh -c "
        apk add --no-cache python3 2>/dev/null || true;
        sh /seed/seed_elasticsearch.sh;
      "
    environment:
      - ES_URL=http://elasticsearch:9200
    restart: on-failure

# Declared to match the base compose so that, when the two files are merged,
# the harness attaches to Mosaic's own project network (do not run this overlay
# standalone — always pass -f docker-compose.yml -f docker-compose.demo.yml).
networks:
  mosaic-net:
    driver: bridge

volumes:
  demo-postgres-data:
  demo-elasticsearch-data:
  demo-mysql-data:
  demo-mssql-data:
  demo-influxdb-data:
  demo-mongodb-data:
  demo-minio-data:
  demo-sftp-data:
