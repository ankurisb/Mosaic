<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mosaic — offline</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #f0f0f0; padding: 24px; text-align: center; }
  .mark { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  p { font-size: 14px; color: #a0a0a0; max-width: 300px; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 10px; border: 1px solid #333; background: #141414; color: #f0f0f0; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <div class="mark">Mosaic</div>
    <h1>You're offline</h1>
    <p>Mosaic needs a connection to reach your data sources and the AI. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
